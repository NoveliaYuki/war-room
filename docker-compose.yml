services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-4040}:4040"
    environment:
      PORT: "4040"
      HOST: "${BACKEND_HOST:-0.0.0.0}"
      WARROOM_DATA_DIR: /data
      LOGO_LOOKUP_ENABLED: "${LOGO_LOOKUP_ENABLED:-false}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000},http://frontend"
    volumes:
      - warroom-data:/data
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 10s
    networks:
      - war-room-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - war-room-network

  test-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      PORT: "4040"
      HOST: "${BACKEND_HOST:-0.0.0.0}"
      WARROOM_DATA_DIR: /data
      LOGO_LOOKUP_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://test-frontend
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0750
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 10s
    networks:
      war-room-test-network:
        aliases:
          - backend

  test-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s
    depends_on:
      test-backend:
        condition: service_healthy
    networks:
      - war-room-test-network

  test:
    build:
      context: .
      dockerfile: e2e/Dockerfile
      args:
        BASE_VERSION: ${BASE_VERSION:-0.0.0}
        VERSION_BUMP: ${VERSION_BUMP:-patch}
    restart: "no"
    environment:
      WARROOM_E2E_BASE_URL: http://test-frontend
      BASE_VERSION: ${BASE_VERSION:-0.0.0}
      VERSION_BUMP: ${VERSION_BUMP:-patch}
    depends_on:
      test-backend:
        condition: service_healthy
      test-frontend:
        condition: service_healthy
    networks: ["war-room-test-network"]

networks:
  war-room-network:
    driver: bridge
  war-room-test-network:
    driver: bridge

volumes:
  warroom-data:
    driver: local
