<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/public/js/theme.js"></script>
  <title>War Room | Selection Process Command Center</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2338bdf8%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/><circle cx=%2212%22 cy=%2212%22 r=%226%22/><circle cx=%2212%22 cy=%2212%22 r=%222%22/></svg>" />

  <link rel="stylesheet" href="/public/css/variables.css" />
  <link rel="stylesheet" href="/public/css/base.css" />
  <link rel="stylesheet" href="/public/css/layout.css" />
  <link rel="stylesheet" href="/public/css/card.css" />
  <link rel="stylesheet" href="/public/css/modal.css" />
  <link rel="stylesheet" href="/public/css/stages.css" />
  <link rel="stylesheet" href="/public/css/schedule.css" />
  <link rel="stylesheet" href="/public/css/animations.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="app-container">
    <header class="app-header">
      <div class="header-inner">
        <button id="btn-menu-toggle" class="menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="header-controls" aria-expanded="false">
          <svg class="svg-icon menu-icon-open" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
          <svg class="svg-icon menu-icon-close" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="brand-section">
          <div class="brand-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="6"/>
              <circle cx="12" cy="12" r="2"/>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">
              War Room
            </h1>
          </div>
        </div>

        <div class="header-controls" id="header-controls">
          <nav class="view-controls" aria-label="Process views">
            <div class="filter-tabs">
              <div class="filter-current-group">
                <button id="filter-current-action" class="filter-current filter-current-action" type="button" aria-label="Show ongoing processes">
                  <span id="filter-current-label">Ongoing</span>
                  <span class="tab-count" id="filter-current-count">0</span>
                </button>
                <button id="filter-menu-trigger" class="filter-current filter-current-dropdown" type="button" aria-label="Choose status filter" title="Choose status filter" aria-haspopup="menu" aria-expanded="false" aria-controls="filter-menu">
                  <svg class="svg-icon filter-current-chevron" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
              </div>
              <div class="filter-menu" id="filter-menu" role="menu" aria-label="Choose process view" hidden>
            <button class="filter-tab active" data-filter="ongoing" role="menuitemradio" aria-checked="true">
              <span class="filter-label">Ongoing</span>
              <span class="tab-count" id="count-ongoing">0</span>
            </button>
            <button class="filter-tab" data-filter="accepted" role="menuitemradio" aria-checked="false">
              <span class="filter-label">Accepted</span>
              <span class="tab-count" id="count-accepted">0</span>
            </button>
            <button class="filter-tab" data-filter="rejected" role="menuitemradio" aria-checked="false">
              <span class="filter-label">Rejected</span>
              <span class="tab-count" id="count-rejected">0</span>
            </button>
            <button class="filter-tab" data-filter="all" role="menuitemradio" aria-checked="false">
              <span class="filter-label">All</span>
              <span class="tab-count" id="count-all">0</span>
            </button>
              </div>
            </div>
            <button class="btn-secondary schedule-trigger" data-filter="schedule" id="tab-schedule" type="button" aria-pressed="false">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span>Daily Schedule</span>
              <span class="tab-count" id="count-meetings">0</span>
            </button>
          </nav>

          <div class="header-search-actions">
          <div class="search-wrapper">
            <button type="button" class="search-focus" aria-label="Focus search field">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
              <input type="text" id="search-input" class="search-input" aria-label="Search selection processes" placeholder="Search company, title, tag..." />
              <span class="search-shortcut">/</span>
            </div>

            <div class="more-actions-menu">
              <button id="toolbar-more-trigger" class="btn-secondary toolbar-more-trigger" type="button" aria-label="More options" title="More options" aria-haspopup="menu" aria-expanded="false" aria-controls="toolbar-more-options">
                <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
              </button>
              <div class="toolbar-more-options" id="toolbar-more-options" role="menu" aria-label="More options" hidden>
                <button id="btn-cv-library" class="toolbar-more-option" type="button" role="menuitem">CV Library<span>Manage saved CV versions</span></button>
                <button id="btn-data-management" class="toolbar-more-option" type="button" role="menuitem">Data &amp; Backups<span>Import or export app data</span></button>
              </div>
            </div>
            <button id="btn-new-process" class="btn-primary new-process-trigger" title="New Selection Process" aria-label="New Selection Process">
              <span class="inline-icon-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span class="new-process-label">New Process</span>
              </span>
            </button>
            <button id="btn-theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme">
              <svg class="svg-icon theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
              <svg class="svg-icon theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
            </button>
          </div>
        </div>
        <button id="btn-new-process-mobile" class="btn-primary new-process-trigger mobile-new-process" title="New Selection Process" aria-label="New Selection Process">
          <span class="inline-icon-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span class="new-process-label">New Process</span>
          </span>
        </button>
      </div>
    </header>

    <main id="main-content">
      <div id="cards-grid" class="cards-grid">
        <!-- Rendered dynamically by cardGrid.js -->
      </div>
    </main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop">
    <div id="detail-modal" class="modal-container card-detail-modal" role="dialog" aria-modal="true" tabindex="-1">
      <!-- Injected dynamically via detailModal.js -->
    </div>
  </div>

  <script type="module" src="/public/js/boot.js"></script>
</body>
</html>
