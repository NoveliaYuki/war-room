name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precommit:
    name: Precommit suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run required quality and test gates
        run: docker compose --project-name war-room-precommit up --build --abort-on-container-exit --exit-code-from test test

      - name: Build current runtime images for vulnerability scanning
        run: docker compose --project-name war-room-security build --pull backend frontend

      - name: Scan images and dependency manifests against EPSS and CISA KEV
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          mkdir -p "$RUNNER_TEMP/warroom-trivy-cache" "$RUNNER_TEMP/warroom-trivy-reports"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/warroom-trivy-cache:/root/.cache/" \
            -v "$RUNNER_TEMP/warroom-trivy-reports:/reports" \
            "$TRIVY_IMAGE" image --scanners vuln --format json \
            --output /reports/backend.json war-room-security-backend:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/warroom-trivy-cache:/root/.cache/" \
            -v "$RUNNER_TEMP/warroom-trivy-reports:/reports" \
            "$TRIVY_IMAGE" image --scanners vuln --format json \
            --output /reports/frontend.json war-room-security-frontend:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/warroom-trivy-cache:/root/.cache/" \
            -v "$RUNNER_TEMP/warroom-trivy-reports:/reports" \
            "$TRIVY_IMAGE" image --scanners vuln --format json \
            --output /reports/test-runner.json war-room-precommit-test:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/warroom-trivy-cache:/root/.cache/" \
            -v "$RUNNER_TEMP/warroom-trivy-reports:/reports" \
            "$TRIVY_IMAGE" fs --scanners vuln --include-dev-deps \
            --skip-dirs /workspace/.git \
            --skip-dirs /workspace/data \
            --skip-dirs /workspace/backend/data \
            --skip-dirs /workspace/frontend/node_modules \
            --format json --output /reports/source.json /workspace
          node scripts/check-epss-threshold.mjs \
            "$RUNNER_TEMP/warroom-trivy-reports/backend.json" \
            "$RUNNER_TEMP/warroom-trivy-reports/frontend.json" \
            "$RUNNER_TEMP/warroom-trivy-reports/test-runner.json" \
            "$RUNNER_TEMP/warroom-trivy-reports/source.json"

      - name: Scan tracked source for secrets
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          set -o pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            "$TRIVY_IMAGE" fs --scanners secret --format json \
            --skip-dirs /workspace/.git \
            --skip-dirs /workspace/data \
            --skip-dirs /workspace/backend/data \
            --skip-dirs /workspace/frontend/node_modules \
            /workspace | node scripts/check-trivy-secrets.mjs

      - name: Run Semgrep Community Edition SAST
        run: |
          set -o pipefail
          docker build --pull -t war-room-semgrep ./security
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src \
            war-room-semgrep \
            semgrep scan --config p/security-audit --error --metrics off --json \
            --exclude data \
            --exclude backend/data \
            --exclude frontend/node_modules . | node scripts/check-semgrep-report.mjs

      - name: Remove isolated test services
        if: always()
        run: |
          docker compose --project-name war-room-precommit down
          docker compose --project-name war-room-security down
